<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Мировая карта — Варгейм</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
  <div id="app">
    <header id="hud">
      <div class="hud-block">
        <span class="label">Ход:</span>
        <span id="turn">1</span>
      </div>
      <div class="hud-block">
        <span class="label">Игрок:</span>
        <span id="player">Игрок 1</span>
      </div>
      <div class="hud-block">
        <span class="label">Ресурсы:</span>
        <span id="resources">1000</span>
      </div>
      <div class="hud-block">
        <span class="label">Выбранный регион:</span>
        <span id="selected-region">—</span>
      </div>
    </header>

    <div id="map"></div>

    <aside id="panel">
      <h2 id="region-name">Выберите регион</h2>
      <div id="region-info">
        <p><b>Владелец:</b> <span id="region-owner">—</span></p>
        <p><b>Ресурсы:</b> <span id="region-resources">—</span></p>
        <p><b>Гарнизон:</b> <span id="region-units">—</span></p>
      </div>
      <div class="actions">
        <button id="btn-move">Переместить войска</button>
        <button id="btn-end-turn">Завершить ход</button>
      </div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>
</body>
</html>
