<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WarGame Map</title>

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<div id="map"></div>

<div id="ui-panel">
  <h3>⚔ WarGame Map</h3>
  <label><input type="checkbox" id="toggle-borders" checked> Границы</label><br>
  <label><input type="checkbox" id="toggle-roads" checked> Дороги</label><br>
  <label><input type="checkbox" id="toggle-cities" checked> Города</label><br>
  <label><input type="checkbox" id="toggle-terrain" checked> Местность</label><br>
  <label><input type="checkbox" id="toggle-labels" checked> Подписи</label>
  <hr>
  <button id="zoom-in">+</button>
  <button id="zoom-out">−</button>
  <button id="reset-view">Сброс</button>
  <div id="coords">—</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="script.js"></script>
</body>
</html>
