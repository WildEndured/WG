<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Global Map — Real World (GeoJSON)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05080f;
    color: #c9d1d9;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #ui {
    padding: 8px 16px;
    background: #0e1626;
    border-bottom: 1px solid #1e2a44;
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 12px;
    z-index: 10;
    flex-wrap: wrap;
  }
  #ui button {
    background: #16233c;
    color: #c9d1d9;
    border: 1px solid #2a3a5c;
    padding: 5px 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    border-radius: 3px;
    transition: all 0.15s;
  }
  #ui button:hover { background: #223354; border-color: #4a6aa0; }
  #ui button.active { background: #2a4a8c; border-color: #5a8adc; color: #fff; }
  #info { margin-left: auto; color: #6a7a90; }
  #map-container { flex: 1; position: relative; overflow: hidden; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #tooltip {
    position: absolute;
    background: rgba(8, 12, 22, 0.96);
    border: 1px solid #2a3a5c;
    padding: 10px 14px;
    font-size: 11px;
    pointer-events: none;
    border-radius: 3px;
    display: none;
    z-index: 20;
    box-shadow: 0 4px 20px rgba(0,0,0,0.7);
    line-height: 1.6;
    max-width: 260px;
  }
  #tooltip b { color: #5a9aed; font-size: 13px; }
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05080f;
    color: #5a7aad;
    font-size: 14px;
    z-index: 30;
    flex-direction: column;
    gap: 12px;
  }
  #loading .bar {
    width: 200px; height: 3px;
    background: #1a2540; border-radius: 2px;
    overflow: hidden;
  }
  #loading .bar > div {
    height: 100%; width: 0%;
    background: #4a8adc;
    transition: width 0.2s;
  }
</style>
</head>
<body>

<div id="ui">
  <button id="btnRegenerate">🔄 Перекрасить</button>
  <button id="btnLabels" class="active">🏷 Страны</button>
  <button id="btnGrid">📐 Сетка</button>
  <button id="btnReset">🎯 Сброс</button>
  <span id="info">Загрузка данных...</span>
</div>

<div id="map-container">
  <canvas id="map"></canvas>
  <div id="tooltip"></div>
  <div id="loading">
    <div>Загрузка карты мира...</div>
    <div class="bar"><div id="loadbar"></div></div>
  </div>
</div>

<script>
// ============================================================
// КОНСТАНТЫ И СОСТОЯНИЕ
// ============================================================
const GEOJSON_URL = 'data/world-110m.geojson';

const WORLD = {
  width: 1024,     // логическая ширина карты
  height: 512,     // логическая высота (эквипрямоугольная проекция 2:1)
  lonMin: -180,
  lonMax: 180,
  latMin: -90,
  latMax: 90,
};

const state = {
  features: [],
  bboxes: [],
  colors: new Map(),   // name -> color
  camera: { x: WORLD.width / 2, y: WORLD.height / 2, zoom: 1 },
  showLabels: true,
  showGrid: false,
  selected: null,
  hovered: null,
  colorSeed: 42,
};

// ============================================================
// ПРОЕКЦИЯ: эквипрямоугольная
// ============================================================
function project(lon, lat) {
  const x = (lon - WORLD.lonMin) / (WORLD.lonMax - WORLD.lonMin) * WORLD.width;
  const y = (WORLD.latMax - lat) / (WORLD.latMax - WORLD.latMin) * WORLD.height;
  return [x, y];
}

// ============================================================
// ЗАГРУЗКА GEOJSON
// ============================================================
async function loadWorld() {
  const bar = document.getElementById('loadbar');
  bar.style.width = '20%';

  const res = await fetch(GEOJSON_URL);
  if (!res.ok) throw new Error(`HTTP ${res.status} — проверь путь ${GEOJSON_URL}`);
  bar.style.width = '60%';

  const data = await res.json();
  bar.style.width = '90%';

  // Нормализация: FeatureCollection
  const features = data.type === 'FeatureCollection'
    ? data.features
    : [{ type: 'Feature', geometry: data, properties: {} }];

  // Предрасчёт bbox для каждого feature (ускорение hit-test)
  const bboxes = [];
  for (const f of features) {
    const bb = computeBBox(f.geometry);
    bboxes.push(bb);
  }

  state.features = features;
  state.bboxes = bboxes;

  bar.style.width = '100%';

  // Спрятать лоадер
  setTimeout(() => {
    document.getElementById('loading').style.display = 'none';
  }, 200);

  // Сгенерировать цвета
  recolor();
}

// Bounding box в градусах
function computeBBox(geom) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

  function visit(coords) {
    if (typeof coords[0] === 'number') {
      const [lon, lat] = coords;
      if (lon < minX) minX = lon;
      if (lon > maxX) maxX = lon;
      if (lat < minY) minY = lat;
      if (lat > maxY) maxY = lat;
    } else {
      for (const c of coords) visit(c);
    }
  }

  visit(geom.coordinates);
  return { minX, minY, maxX, maxY };
}

// ============================================================
// ЦВЕТА СТРАН (детерминированные по имени)
// ============================================================
function hashString(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function recolor() {
  state.colors.clear();
  const usedColors = [];
  for (const f of state.features) {
    const name = getFeatureName(f);
    const hue = (hashString(name + state.colorSeed) % 360);
    const sat = 35 + (hashString(name + 'x') % 30);
    const light = 32 + (hashString(name + 'y') % 18);
    state.colors.set(name, `hsl(${hue}, ${sat}%, ${light}%)`);
  }
}

function getFeatureName(f) {
  const p = f.properties || {};
  return p.NAME || p.name || p.ADMIN || p.admin ||
         p.SOVEREIGNT || p.sovereignt ||
         p.ISO_A3 || p.iso_a3 || 'Unknown';
}

function getFeatureNameRu(f) {
  const p = f.properties || {};
  return p.NAME_RU || p.name_ru || p.NAME_ZHT || getFeatureName(f);
}

// ============================================================
// CANVAS
// ============================================================
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const container = document.getElementById('map-container');
const tooltip = document.getElementById('tooltip');

let W, H;
function resize() {
  W = container.clientWidth;
  H = container.clientHeight;
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  render();
}
window.addEventListener('resize', resize);

// ============================================================
// РЕНДЕР
// ============================================================
let renderQueued = false;
function queueRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    render();
  });
}

function render() {
  const { camera, features, colors } = state;

  // Фон — океан
  const oceanGrad = ctx.createLinearGradient(0, 0, 0, H);
  oceanGrad.addColorStop(0, '#0a1a30');
  oceanGrad.addColorStop(0.5, '#0d2540');
  oceanGrad.addColorStop(1, '#0a1a30');
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(camera.zoom, camera.zoom);
  ctx.translate(-camera.x, -camera.y);

  // Видимая область (для отсечения)
  const viewLeft   = camera.x - W / 2 / camera.zoom;
  const viewRight  = camera.x + W / 2 / camera.zoom;
  const viewTop    = camera.y - H / 2 / camera.zoom;
  const viewBottom = camera.y + H / 2 / camera.zoom;

  // Рисуем страны
  for (let i = 0; i < features.length; i++) {
    const f = features[i];
    const bb = state.bboxes[i];
    const name = getFeatureName(f);

    // Проверка bbox против видимой области
    const [bx1, by1] = project(bb.minX, bb.maxY);
    const [bx2, by2] = project(bb.maxX, bb.minY);
    if (bx2 < viewLeft || bx1 > viewRight || by2 < viewTop || by1 > viewBottom) continue;

    const isSelected = name === state.selected;
    const isHovered = name === state.hovered;

    drawGeometry(f.geometry, colors.get(name) || '#3a5b3a', isSelected, isHovered);
  }

  // Сетка координат
  if (state.showGrid) {
    ctx.strokeStyle = 'rgba(90,140,220,0.22)';
    ctx.lineWidth = 0.6 / camera.zoom;
    ctx.beginPath();
    for (let lon = -180; lon <= 180; lon += 30) {
      const [x] = project(lon, 0);
      ctx.moveTo(x, 0); ctx.lineTo(x, WORLD.height);
    }
    for (let lat = -60; lat <= 60; lat += 30) {
      const [, y] = project(0, lat);
      ctx.moveTo(0, y); ctx.lineTo(WORLD.width, y);
    }
    ctx.stroke();

    // Экватор
    const [, eqY] = project(0, 0);
    ctx.strokeStyle = 'rgba(255,200,80,0.55)';
    ctx.beginPath();
    ctx.moveTo(0, eqY); ctx.lineTo(WORLD.width, eqY);
    ctx.stroke();
  }

  // Названия стран
  if (state.showLabels && camera.zoom > 0.9) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < features.length; i++) {
      const f = features[i];
      const bb = state.bboxes[i];

      // Отсечение
      const [bx1, by1] = project(bb.minX, bb.maxY);
      const [bx2, by2] = project(bb.maxX, bb.minY);
      if (bx2 < viewLeft || bx1 > viewRight || by2 < viewTop || by1 > viewBottom) continue;

      // Центроид bbox как позиция метки
      const cx = (bx1 + bx2) / 2;
      const cy = (by1 + by2) / 2;

      const sizeW = (bx2 - bx1) * camera.zoom;
      const sizeH = (by2 - by1) * camera.zoom;

      // Не рисуем мелкие подписи
      if (sizeW < 25 || sizeH < 12) continue;

      const name = getFeatureNameRu(f);
      const fs = Math.max(7, Math.min(13, sizeW / 10) / camera.zoom);
      ctx.font = `bold ${fs}px 'Courier New', monospace`;
      ctx.lineWidth = 3 / camera.zoom;
      ctx.strokeStyle = 'rgba(0,0,0,0.85)';
      ctx.strokeText(name.toUpperCase(), cx, cy);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(name.toUpperCase(), cx, cy);
    }
  }

  ctx.restore();

  // Info bar
  const sel = state.selected;
  document.getElementById('info').innerHTML = sel
    ? `Выбрано: <b style="color:#5a9aed">${sel}</b> | Всего стран: ${state.features.length}`
    : `ЛКМ — панорама | Колесо — зум | Клик — выбрать | Стран: ${state.features.length}`;
}

// ============================================================
// ОТРИСОВКА ГЕОМЕТРИИ
// ============================================================
function drawGeometry(geom, fillColor, selected, hovered) {
  if (!geom) return;

  ctx.beginPath();
  traceGeometry(geom);

  // Заливка
  if (selected) {
    ctx.fillStyle = fillColor;
    ctx.globalAlpha = 1;
  } else if (hovered) {
    ctx.fillStyle = fillColor;
    ctx.globalAlpha = 0.85;
  } else {
    ctx.fillStyle = fillColor;
    ctx.globalAlpha = 1;
  }
  ctx.fill();

  // Обводка
  if (selected) {
    ctx.strokeStyle = '#ffcc00';
    ctx.lineWidth = 2 / state.camera.zoom;
  } else if (hovered) {
    ctx.strokeStyle = 'rgba(255,255,255,0.9)';
    ctx.lineWidth = 1.5 / state.camera.zoom;
  } else {
    ctx.strokeStyle = 'rgba(0,0,0,0.45)';
    ctx.lineWidth = 0.7 / state.camera.zoom;
  }
  ctx.stroke();

  ctx.globalAlpha = 1;
}

function traceGeometry(geom) {
  const { type, coordinates } = geom;

  if (type === 'Polygon') {
    for (const ring of coordinates) traceRing(ring);
  } else if (type === 'MultiPolygon') {
    for (const poly of coordinates) {
      for (const ring of poly) traceRing(ring);
    }
  }
}

function traceRing(ring) {
  let first = true;
  for (const [lon, lat] of ring) {
    const [x, y] = project(lon, lat);
    if (first) { ctx.moveTo(x, y); first = false; }
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
}

// ============================================================
// HIT-TEST: определение страны под курсором
// ============================================================
function screenToWorld(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const mx = clientX - rect.left;
  const my = clientY - rect.top;
  return [
    (mx - W / 2) / state.camera.zoom + state.camera.x,
    (my - H / 2) / state.camera.zoom + state.camera.y,
  ];
}

function worldToLonLat(wx, wy) {
  const lon = wx / WORLD.width * (WORLD.lonMax - WORLD.lonMin) + WORLD.lonMin;
  const lat = WORLD.latMax - wy / WORLD.height * (WORLD.latMax - WORLD.latMin);
  return [lon, lat];
}

function pointInRing(lon, lat, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1];
    const xj = ring[j][0], yj = ring[j][1];
    const intersect = ((yi > lat) !== (yj > lat)) &&
      (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi);
    if (intersect) inside = !inside;
  }
  return inside;
}

function pointInGeometry(lon, lat, geom) {
  const { type, coordinates } = geom;

  if (type === 'Polygon') {
    // Первое кольцо — внешнее, остальные — дырки
    if (!pointInRing(lon, lat, coordinates[0])) return false;
    for (let i = 1; i < coordinates.length; i++) {
      if (pointInRing(lon, lat, coordinates[i])) return false;
    }
    return true;
  } else if (type === 'MultiPolygon') {
    for (const poly of coordinates) {
      if (!pointInRing(lon, lat, poly[0])) continue;
      let inHole = false;
      for (let i = 1; i < poly.length; i++) {
        if (pointInRing(lon, lat, poly[i])) { inHole = true; break; }
      }
      if (!inHole) return true;
    }
  }
  return false;
}

function findFeatureAt(lon, lat) {
  for (let i = 0; i < state.features.length; i++) {
    const bb = state.bboxes[i];
    if (lon < bb.minX || lon > bb.maxX || lat < bb.minY || lat > bb.maxY) continue;
    if (pointInGeometry(lon, lat, state.features[i].geometry)) {
      return state.features[i];
    }
  }
  return null;
}

// ============================================================
// КАМЕРА / МЫШЬ
// ============================================================
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let cameraStart = { x: 0, y: 0 };
let dragMoved = false;

canvas.addEventListener('mousedown', e => {
  isDragging = true;
  dragMoved = false;
  dragStart = { x: e.clientX, y: e.clientY };
  cameraStart = { x: state.camera.x, y: state.camera.y };
});

window.addEventListener('mousemove', e => {
  if (isDragging) {
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
    state.camera.x = cameraStart.x - dx / state.camera.zoom;
    state.camera.y = cameraStart.y - dy / state.camera.zoom;
    clampCamera();
    queueRender();
  } else {
    updateHover(e);
  }
});

window.addEventListener('mouseup', e => {
  if (isDragging && !dragMoved) handleClick(e);
  isDragging = false;
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const oldZoom = state.camera.zoom;
  const factor = e.deltaY < 0 ? 1.2 : 0.83;
  const newZoom = Math.max(0.8, Math.min(40, oldZoom * factor));

  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const wx = (mx - W / 2) / oldZoom + state.camera.x;
  const wy = (my - H / 2) / oldZoom + state.camera.y;

  state.camera.zoom = newZoom;
  state.camera.x = wx - (mx - W / 2) / newZoom;
  state.camera.y = wy - (my - H / 2) / newZoom;
  clampCamera();
  queueRender();
}, { passive: false });

function clampCamera() {
  const halfW = W / 2 / state.camera.zoom;
  const halfH = H / 2 / state.camera.zoom;
  state.camera.x = Math.max(halfW, Math.min(WORLD.width - halfW, state.camera.x));
  state.camera.y = Math.max(halfH, Math.min(WORLD.height - halfH, state.camera.y));
}

// ============================================================
// HOVER / CLICK
// ============================================================
let hoverTimeout = null;
function updateHover(e) {
  // Троттлинг тяжёлого hit-test
  if (hoverTimeout) return;
  hoverTimeout = setTimeout(() => hoverTimeout = null, 40);

  const [wx, wy] = screenToWorld(e.clientX, e.clientY);
  const [lon, lat] = worldToLonLat(wx, wy);
  const feature = findFeatureAt(lon, lat);
  const newHover = feature ? getFeatureName(feature) : null;

  if (newHover !== state.hovered) {
    state.hovered = newHover;
    queueRender();
  }

  const rect = container.getBoundingClientRect();
  if (feature) {
    const p = feature.properties || {};
    const nameRu = getFeatureNameRu(feature);
    const nameEn = getFeatureName(feature);
    const iso = p.ISO_A3 || p.iso_a3 || '—';
    const continent = p.CONTINENT || p.continent || '—';
    const pop = p.POP_EST || p.pop_est;

    tooltip.style.display = 'block';
    let left = e.clientX - rect.left + 15;
    let top = e.clientY - rect.top + 15;
    // Не вылезаем за экран
    if (left > W - 270) left = e.clientX - rect.left - 270;
    if (top > H - 120) top = e.clientY - rect.top - 130;

    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';
    tooltip.innerHTML = `
      <b>${nameRu}</b><br>
      <span style="color:#6a7a90">${nameEn}</span><br>
      ISO: ${iso}<br>
      Континент: ${continent}
      ${pop ? `<br>Население: ~${(pop / 1e6).toFixed(1)} млн` : ''}
    `;
  } else {
    tooltip.style.display = 'none';
  }
}

function handleClick(e) {
  const [wx, wy] = screenToWorld(e.clientX, e.clientY);
  const [lon, lat] = worldToLonLat(wx, wy);
  const feature = findFeatureAt(lon, lat);

  if (feature) {
    const name = getFeatureName(feature);
    state.selected = (state.selected === name) ? null : name;
  } else {
    state.selected = null;
  }
  queueRender();
}

// ============================================================
// UI
// ============================================================
document.getElementById('btnRegenerate').addEventListener('click', () => {
  state.colorSeed = Math.floor(Math.random() * 1e9);
  recolor();
  queueRender();
});
document.getElementById('btnLabels').addEventListener('click', e => {
  state.showLabels = !state.showLabels;
  e.target.classList.toggle('active', state.showLabels);
  queueRender();
});
document.getElementById('btnGrid').addEventListener('click', e => {
  state.showGrid = !state.showGrid;
  e.target.classList.toggle('active', state.showGrid);
  queueRender();
});
document.getElementById('btnReset').addEventListener('click', () => {
  state.camera = { x: WORLD.width / 2, y: WORLD.height / 2, zoom: 1 };
  state.selected = null;
  state.hovered = null;
  queueRender();
});

// ============================================================
// ЗАПУСК
// ============================================================
resize();
loadWorld().then(() => {
  clampCamera();
  render();
}).catch(err => {
  document.getElementById('loading').innerHTML =
    `<div style="color:#e74c3c;text-align:center;padding:20px">
       ❌ Ошибка загрузки: ${err.message}<br>
       <span style="font-size:11px;color:#7a8aa0">
         Убедись, что файл ${GEOJSON_URL} существует<br>
         и открываешь страницу через HTTP-сервер (не file://)
       </span>
     </div>`;
  console.error(err);
});
</script>
</body>
</html>
