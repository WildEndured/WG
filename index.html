<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Глобальная карта — Варгейм</title>
    <link rel="stylesheet" href="style.css">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
</head>
<body>
    <div id="app">
        <!-- Боковая панель -->
        <aside id="sidebar">
            <h1>⚔️ Варгейм</h1>
            <div class="panel">
                <h2>Выбранная территория</h2>
                <div id="info">
                    <p class="muted">Кликните по региону на карте</p>
                </div>
            </div>

            <div class="panel">
                <h2>Действия</h2>
                <button id="btn-attack" class="action attack">⚔️ Атаковать</button>
                <button id="btn-move"   class="action move">🚀 Перебросить войска</button>
                <button id="btn-fortify" class="action fortify">🛡️ Укрепить</button>
                <button id="btn-reset"  class="action reset">🔄 Сбросить</button>
            </div>

            <div class="panel">
                <h2>Слои</h2>
                <label><input type="checkbox" id="toggle-borders" checked> Границы</label>
                <label><input type="checkbox" id="toggle-units" checked> Юниты</label>
                <label><input type="checkbox" id="toggle-grid"> Сетка</label>
            </div>

            <div class="panel">
                <h2>Лог событий</h2>
                <ul id="log"></ul>
            </div>
        </aside>

        <!-- Карта -->
        <main id="map"></main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
