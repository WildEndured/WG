<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Global Map — Real World</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #06090f;
    color: #c9d1d9;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #ui {
    padding: 8px 16px;
    background: #0e1626;
    border-bottom: 1px solid #1e2a44;
    display: flex;
    gap: 14px;
    align-items: center;
    font-size: 12px;
    z-index: 10;
  }
  #ui button {
    background: #16233c;
    color: #c9d1d9;
    border: 1px solid #2a3a5c;
    padding: 5px 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    border-radius: 3px;
    transition: all 0.15s;
  }
  #ui button:hover { background: #223354; border-color: #4a6aa0; }
  #ui button.active { background: #2a4a8c; border-color: #5a8adc; color: #fff; }
  #info { margin-left: auto; color: #6a7a90; }
  #map-container { flex: 1; position: relative; overflow: hidden; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }
  #tooltip {
    position: absolute;
    background: rgba(8, 12, 22, 0.96);
    border: 1px solid #2a3a5c;
    padding: 8px 12px;
    font-size: 11px;
    pointer-events: none;
    border-radius: 3px;
    display: none;
    z-index: 20;
    box-shadow: 0 4px 20px rgba(0,0,0,0.7);
    line-height: 1.5;
  }
  #tooltip b { color: #5a9aed; }
</style>
</head>

<div id="map-container">
  <canvas id="map"></canvas>

// ============================================================
// ПРОЕКЦИЯ: эквипрямоугольная
// lon [-180,180] -> x [0, W]; lat [90,-90] -> y [0, H]
// ============================================================
const WORLD_W = 1024;
const WORLD_H = 512;

function lonLatToXY(lon, lat) {
  const x = (lon + 180) / 360 * WORLD_W;
  const y = (90 - lat) / 180 * WORLD_H;
  return [x, y];
}

// ============================================================
// СОСТОЯНИЕ
// ============================================================
const state = {
  camera: { x: WORLD_W / 2, y: WORLD_H / 2, zoom: 1 },
  showLabels: true,
  showCities: false,
  showGrid: false,
  selected: null,      // имя страны
  hovered: null,
};

// ============================================================
// CANVAS
// ============================================================
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d');
const container = document.getElementById('map-container');
const tooltip = document.getElementById('tooltip');

let W, H;
function resize() {
  W = container.clientWidth;
  H = container.clientHeight;
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  render();
}
window.addEventListener('resize', resize);

// ============================================================
// РЕНДЕР
// ============================================================
function render() {
  const { camera } = state;

  // Фон — океан
  ctx.fillStyle = '#0a1a2e';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(camera.zoom, camera.zoom);
  ctx.translate(-camera.x, -camera.y);

  // Мерцание воды (сетка)
  ctx.strokeStyle = 'rgba(30,60,110,0.25)';
  ctx.lineWidth = 0.4 / camera.zoom;
  ctx.beginPath();
  for (let y = 0; y <= WORLD_H; y += 16) {
    ctx.moveTo(0, y); ctx.lineTo(WORLD_W, y);
  }
  for (let x = 0; x <= WORLD_W; x += 16) {
    ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_H);
  }
  ctx.stroke();

  // ===== СУША =====
  for (const key in LANDMASSES) {
    const lm = LANDMASSES[key];
    for (const poly of lm.polygons) {
      ctx.beginPath();
      let first = true;
      for (const [lon, lat] of poly) {
        const [x, y] = lonLatToXY(lon, lat);
        if (first) { ctx.moveTo(x, y); first = false; }
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fillStyle = lm.color;
      ctx.fill();
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 0.8 / camera.zoom;
      ctx.stroke();
    }
  }

  // ===== СТРАНЫ (подсветка при выборе/hover) =====
  // Рисуем страны поверх континентов полупрозрачным слоем
  for (const c of COUNTRIES) {
    if (c.name !== state.selected && c.name !== state.hovered) continue;
    ctx.beginPath();
    let first = true;
    for (const [lon, lat] of c.poly) {
      const [x, y] = lonLatToXY(lon, lat);
      if (first) { ctx.moveTo(x, y); first = false; }
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.globalAlpha = c.name === state.selected ? 0.6 : 0.35;
    ctx.fillStyle = c.color;
    ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = c.name === state.selected ? '#ffcc00' : 'rgba(255,255,255,0.8)';
    ctx.lineWidth = (c.name === state.selected ? 2 : 1) / camera.zoom;
    ctx.stroke();
  }

  // ===== ГОРОДА =====
  if (state.showCities || camera.zoom > 2) {
    for (const city of CITIES) {
      const [x, y] = lonLatToXY(city.lon, city.lat);
      const r = Math.max(1.5, 3 / camera.zoom);
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fillStyle = city.cap ? '#ffcc00' : '#ffffff';
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = Math.max(0.5, 1 / camera.zoom);
      ctx.stroke();
    }
  }

  // ===== СЕТКА КООРДИНАТ =====
  if (state.showGrid) {
    ctx.strokeStyle = 'rgba(90,140,220,0.35)';
    ctx.lineWidth = 0.6 / camera.zoom;
    ctx.beginPath();
    for (let lon = -180; lon <= 180; lon += 30) {
      const [x] = lonLatToXY(lon, 0);
      ctx.moveTo(x, 0); ctx.lineTo(x, WORLD_H);
    }
    for (let lat = -60; lat <= 60; lat += 30) {
      const [, y] = lonLatToXY(0, lat);
      ctx.moveTo(0, y); ctx.lineTo(WORLD_W, y);
    }
    ctx.stroke();

    // Экватор
    const [, eqY] = lonLatToXY(0, 0);
    ctx.strokeStyle = 'rgba(255,200,80,0.6)';
    ctx.beginPath();
    ctx.moveTo(0, eqY); ctx.lineTo(WORLD_W, eqY);
    ctx.stroke();
  }

  // ===== НАЗВАНИЯ СТРАН =====
  if (state.showLabels && camera.zoom > 0.8) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const c of COUNTRIES) {
      // Центроид полигона
      let sx = 0, sy = 0, n = 0;
      for (const [lon, lat] of c.poly) {
        const [x, y] = lonLatToXY(lon, lat);
        sx += x; sy += y; n++;
      }
      const x = sx / n, y = sy / n;
      const fs = Math.max(7, 11 / camera.zoom);
      ctx.font = `bold ${fs}px 'Courier New', monospace`;
      ctx.lineWidth = 3 / camera.zoom;
      ctx.strokeStyle = 'rgba(0,0,0,0.9)';
      ctx.strokeText(c.name.toUpperCase(), x, y);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(c.name.toUpperCase(), x, y);
    }
  }

  // ===== НАЗВАНИЯ ГОРОДОВ =====
  if (state.showCities && camera.zoom > 1.5) {
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    for (const city of CITIES) {
      const [x, y] = lonLatToXY(city.lon, city.lat);
      const fs = Math.max(7, 10 / camera.zoom);
      ctx.font = `${fs}px 'Courier New', monospace`;
      ctx.lineWidth = 2.5 / camera.zoom;
      ctx.strokeStyle = 'rgba(0,0,0,0.9)';
      ctx.strokeText(city.name, x + 5 / camera.zoom, y);
      ctx.fillStyle = '#ffe9a0';
      ctx.fillText(city.name, x + 5 / camera.zoom, y);
    }
  }

  ctx.restore();
}

// ============================================================
// КАМЕРА
// ============================================================
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let cameraStart = { x: 0, y: 0 };
let dragMoved = false;

canvas.addEventListener('mousedown', e => {
  isDragging = true;
  dragMoved = false;
  dragStart = { x: e.clientX, y: e.clientY };
  cameraStart = { x: state.camera.x, y: state.camera.y };
});

window.addEventListener('mousemove', e => {
  if (isDragging) {
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
    state.camera.x = cameraStart.x - dx / state.camera.zoom;
    state.camera.y = cameraStart.y - dy / state.camera.zoom;
    clampCamera();
    render();
  } else {
    updateHover(e);
  }
});

window.addEventListener('mouseup', e => {
  if (isDragging && !dragMoved) handleClick(e);
  isDragging = false;
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const oldZoom = state.camera.zoom;
  const factor = e.deltaY < 0 ? 1.2 : 0.83;
  const newZoom = Math.max(0.5, Math.min(20, oldZoom * factor));
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const wx = (mx - W / 2) / oldZoom + state.camera.x;
  const wy = (my - H / 2) / oldZoom + state.camera.y;
  state.camera.zoom = newZoom;
  state.camera.x = wx - (mx - W / 2) / newZoom;
  state.camera.y = wy - (my - H / 2) / newZoom;
  clampCamera();
  render();
}, { passive: false });

function clampCamera() {
  const halfW = W / 2 / state.camera.zoom;
  const halfH = H / 2 / state.camera.zoom;
  state.camera.x = Math.max(halfW, Math.min(WORLD_W - halfW, state.camera.x));
  state.camera.y = Math.max(halfH, Math.min(WORLD_H - halfH, state.camera.y));
}

// ============================================================
// КЛИК / HOVER
// ============================================================
function screenToWorld(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const mx = clientX - rect.left;
  const my = clientY - rect.top;
  return [
    (mx - W / 2) / state.camera.zoom + state.camera.x,
    (my - H / 2) / state.camera.zoom + state.camera.y
  ];
}

function pointInPoly(px, py, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [x1, y1] = lonLatToXY(poly[i][0], poly[i][1]);
    const [x2, y2] = lonLatToXY(poly[j][0], poly[j][1]);
    const intersect = ((y1 > py) !== (y2 > py)) &&
      (px < (x2 - x1) * (py - y1) / (y2 - y1) + x1);
    if (intersect) inside = !inside;
  }
  return inside;
}

function findCountryAt(px, py) {
  for (const c of COUNTRIES) {
    if (pointInPoly(px, py, c.poly)) return c;
  }
  return null;
}

function findCityAt(px, py) {
  const threshold = 8 / state.camera.zoom;
  for (const city of CITIES) {
    const [x, y] = lonLatToXY(city.lon, city.lat);
    if (Math.hypot(px - x, py - y) < threshold) return city;
  }
  return null;
}

function updateHover(e) {
  const [wx, wy] = screenToWorld(e.clientX, e.clientY);
  const city = findCityAt(wx, wy);
  const country = findCountryAt(wx, wy);
  const newHover = country ? country.name : null;

  if (newHover !== state.hovered) {
    state.hovered = newHover;
    render();
  }

  const rect = container.getBoundingClientRect();
  if (city) {
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX - rect.left + 15) + 'px';
    tooltip.style.top = (e.clientY - rect.top + 15) + 'px';
    tooltip.innerHTML = `<b>🏙 ${city.name}</b><br>${city.cap ? 'Столица' : 'Город'}<br>
      Координаты: ${city.lon.toFixed(1)}, ${city.lat.toFixed(1)}`;
  } else if (country) {
    tooltip.style.display = 'block';
    tooltip.style.left = (e.clientX - rect.left + 15) + 'px';
    tooltip.style.top = (e.clientY - rect.top + 15) + 'px';
    tooltip.innerHTML = `<b>${country.name}</b>`;
  } else {
    tooltip.style.display = 'none';
  }
}

function handleClick(e) {
  const [wx, wy] = screenToWorld(e.clientX, e.clientY);
  const country = findCountryAt(wx, wy);
  if (country) {
    state.selected = (state.selected === country.name) ? null : country.name;
  } else {
    state.selected = null;
  }
  render();
}

// ============================================================
// UI
// ============================================================
document.getElementById('btnLabels').addEventListener('click', e => {
  state.showLabels = !state.showLabels;
  e.target.classList.toggle('active', state.showLabels);
  render();
});
document.getElementById('btnCities').addEventListener('click', e => {
  state.showCities = !state.showCities;
  e.target.classList.toggle('active', state.showCities);
  render();
});
document.getElementById('btnGrid').addEventListener('click', e => {
  state.showGrid = !state.showGrid;
  e.target.classList.toggle('active', state.showGrid);
  render();
});
document.getElementById('btnReset').addEventListener('click', () => {
  state.camera = { x: WORLD_W / 2, y: WORLD_H / 2, zoom: 1 };
  state.selected = null;
  state.hovered = null;
  render();
});

// ============================================================
// ЗАПУСК
// ============================================================
resize();
render();
</script>
</body>
</html>
