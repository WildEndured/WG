<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Global Map — Natural Earth 50m</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #05080f;
    color: #c9d1d9;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  #ui {
    padding: 8px 16px;
    background: #0e1626;
    border-bottom: 1px solid #1e2a44;
    display: flex;
    gap: 10px;
    align-items: center;
    font-size: 12px;
    z-index: 10;
    flex-wrap: wrap;
  }
  #ui button {
    background: #16233c;
    color: #c9d1d9;
    border: 1px solid #2a3a5c;
    padding: 5px 12px;
    cursor: pointer;
    font-family: inherit;
    font-size: 11px;
    border-radius: 3px;
    transition: all 0.15s;
  }
  #ui button:hover { background: #223354; border-color: #4a6aa0; }
  #ui button.active { background: #2a4a8c; border-color: #5a8adc; color: #fff; }
  #info { margin-left: auto; color: #6a7a90; }
  #map-container { flex: 1; position: relative; overflow: hidden; }
  canvas { display: block; cursor: grab; image-rendering: auto; }
  canvas:active { cursor: grabbing; }
  #tooltip {
    position: absolute;
    background: rgba(8, 12, 22, 0.96);
    border: 1px solid #2a3a5c;
    padding: 10px 14px;
    font-size: 11px;
    pointer-events: none;
    border-radius: 3px;
    display: none;
    z-index: 20;
    box-shadow: 0 4px 20px rgba(0,0,0,0.7);
    line-height: 1.6;
    max-width: 280px;
  }
  #tooltip b { color: #5a9aed; font-size: 13px; }
  #loading {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #05080f;
    color: #5a7aad;
    font-size: 14px;
    z-index: 30;
    flex-direction: column;
    gap: 14px;
  }
  #loading .bar {
    width: 240px; height: 3px;
    background: #1a2540; border-radius: 2px;
    overflow: hidden;
  }
  #loading .bar > div {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4a8adc, #6ab0ff);
    transition: width 0.2s;
  }
  #fps {
    color: #4a7aad;
    font-size: 11px;
    margin-left: 10px;
  }
</style>
</head>
<body>

<div id="ui">
  <button id="btnRegenerate">🔄 Перекрасить</button>
  <button id="btnLabels" class="active">🏷 Страны</button>
  <button id="btnGrid">📐 Сетка</button>
  <button id="btnBorders" class="active">▦ Границы</button>
  <button id="btnReset">🎯 Сброс</button>
  <span id="fps"></span>
  <span id="info">Загрузка 50m GeoJSON...</span>
</div>

<div id="map-container">
  <canvas id="map"></canvas>
  <div id="tooltip"></div>
  <div id="loading">
    <div>Загрузка Natural Earth 50m...</div>
    <div class="bar"><div id="loadbar"></div></div>
    <div id="loadmsg" style="font-size:11px;color:#3a5a80">~5 МБ, подожди немного</div>
  </div>
</div>

<script>
// ============================================================
// КОНСТАНТЫ
// ============================================================
const GEOJSON_URL = 'data/world-50m.geojson';

const WORLD = {
  width: 2048,      // увеличили логический размер для 50m (больше деталей)
  height: 1024,
  lonMin: -180, lonMax: 180,
  latMin: -90,  latMax: 90,
};

const state = {
  features: [],
  bboxes: [],
  paths: [],              // Path2D-кэш для каждой страны
  pathsLowDetail: [],     // Упрощённый путь для дальнего зума
  colors: new Map(),
  camera: { x: WORLD.width / 2, y: WORLD.height / 2, zoom: 0.5 },
  showLabels: true,
  showGrid: false,
  showBorders: true,
  selected: null,
  hovered: null,
  colorSeed: 42,
};

// ============================================================
// ПРОЕКЦИЯ
// ============================================================
function project(lon, lat) {
  const x = (lon - WORLD.lonMin) / (WORLD.lonMax - WORLD.lonMin) * WORLD.width;
  const y = (WORLD.latMax - lat) / (WORLD.latMax - WORLD.latMin) * WORLD.height;
  return [x, y];
}

// ============================================================
// ЗАГРУЗКА
// ============================================================
async function loadWorld() {
  const bar = document.getElementById('loadbar');
  const msg = document.getElementById('loadmsg');

  msg.textContent = 'Скачивание файла...';
  bar.style.width = '10%';

  const res = await fetch(GEOJSON_URL);
  if (!res.ok) throw new Error(`HTTP ${res.status} — не найден ${GEOJSON_URL}`);

  msg.textContent = 'Чтение JSON...';
  bar.style.width = '30%';

  // Читаем как stream для прогресса (если поддерживается)
  const total = parseInt(res.headers.get('content-length') || '0', 10);
  let text = '';

  if (res.body && total > 0) {
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let received = 0;
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      received += value.length;
      text += decoder.decode(value, { stream: true });
      const pct = 30 + (received / total) * 40;
      bar.style.width = pct + '%';
      msg.textContent = `Загружено ${(received / 1024 / 1024).toFixed(1)} / ${(total / 1024 / 1024).toFixed(1)} МБ`;
    }
  } else {
    text = await res.text();
    bar.style.width = '70%';
  }

  msg.textContent = 'Парсинг...';
  bar.style.width = '72%';
  await nextFrame();

  const data = JSON.parse(text);
  const features = data.type === 'FeatureCollection'
    ? data.features
    : [{ type: 'Feature', geometry: data, properties: {} }];

  state.features = features;

  msg.textContent = `Построение геометрии (${features.length} стран)...`;
  bar.style.width = '75%';
  await nextFrame();

  // ==== BBOX + Path2D — асинхронно с прогрессом ====
  const bboxes = new Array(features.length);
  const paths = new Array(features.length);
  const pathsLow = new Array(features.length);

  for (let i = 0; i < features.length; i++) {
    const f = features[i];
    bboxes[i] = computeBBox(f.geometry);
    paths[i] = buildPath2D(f.geometry, 1);       // полная детализация
    pathsLow[i] = buildPath2D(f.geometry, 3);    // прореживание (каждая 3-я точка)

    if (i % 20 === 0) {
      const pct = 75 + (i / features.length) * 22;
      bar.style.width = pct + '%';
      msg.textContent = `Геометрия: ${i} / ${features.length}`;
      await nextFrame();
    }
  }

  state.bboxes = bboxes;
  state.paths = paths;
  state.pathsLowDetail = pathsLow;

  msg.textContent = 'Готово';
  bar.style.width = '100%';

  recolor();

  setTimeout(() => {
    document.getElementById('loading').style.display = 'none';
  }, 250);
}

function nextFrame() {
  return new Promise(r => requestAnimationFrame(() => r()));
}

function computeBBox(geom) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  const type = geom.type;
  const coords = geom.coordinates;

  function visit(arr) {
    if (typeof arr[0] === 'number') {
      const lon = arr[0], lat = arr[1];
      if (lon < minX) minX = lon;
      if (lon > maxX) maxX = lon;
      if (lat < minY) minY = lat;
      if (lat > maxY) maxY = lat;
    } else {
      for (let i = 0; i < arr.length; i++) visit(arr[i]);
    }
  }

  if (type === 'Polygon' || type === 'MultiPolygon') visit(coords);
  return { minX, minY, maxX, maxY };
}

// ============================================================
// Path2D КЭШ
// ============================================================
function buildPath2D(geom, step) {
  const path = new Path2D();
  const type = geom.type;
  const coords = geom.coordinates;

  if (type === 'Polygon') {
    for (const ring of coords) addRing(path, ring, step);
  } else if (type === 'MultiPolygon') {
    for (const poly of coords) {
      for (const ring of poly) addRing(path, ring, step);
    }
  }
  return path;
}

function addRing(path, ring, step) {
  const len = ring.length;
  if (len === 0) return;

  const [x0, y0] = project(ring[0][0], ring[0][1]);
  path.moveTo(x0, y0);

  for (let i = step; i < len; i += step) {
    const [x, y] = project(ring[i][0], ring[i][1]);
    path.lineTo(x, y);
  }
  // Закрываем последней точкой
  const last = ring[len - 1];
  const [xl, yl] = project(last[0], last[1]);
  path.lineTo(xl, yl);
  path.closePath();
}

// ============================================================
// ЦВЕТА
// ============================================================
function hashString(s) {
  let h = 2166136261;
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return h >>> 0;
}

function recolor() {
  state.colors.clear();
  for (const f of state.features) {
    const name = getFeatureName(f);
    const h1 = hashString(name + state.colorSeed);
    const h2 = hashString(name + '|a' + state.colorSeed);
    const h3 = hashString(name + '|b' + state.colorSeed);
    const hue = h1 % 360;
    const sat = 30 + (h2 % 35);
    const light = 30 + (h3 % 20);
    state.colors.set(name, `hsl(${hue}, ${sat}%, ${light}%)`);
  }
}

function getFeatureName(f) {
  const p = f.properties || {};
  return p.NAME || p.name || p.ADMIN || p.admin ||
         p.SOVEREIGNT || p.sovereignt ||
         p.ISO_A3 || p.iso_a3 || 'Unknown';
}

function getFeatureNameRu(f) {
  const p = f.properties || {};
  return p.NAME_RU || p.name_ru || p.NAME_ZHT || getFeatureName(f);
}

// ============================================================
// CANVAS
// ============================================================
const canvas = document.getElementById('map');
const ctx = canvas.getContext('2d', { alpha: false });
const container = document.getElementById('map-container');
const tooltip = document.getElementById('tooltip');
const fpsEl = document.getElementById('fps');

let W, H;
function resize() {
  W = container.clientWidth;
  H = container.clientHeight;
  canvas.width = W * devicePixelRatio;
  canvas.height = H * devicePixelRatio;
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  render();
}
window.addEventListener('resize', resize);

// ============================================================
// РЕНДЕР + FPS
// ============================================================
let renderQueued = false;
let lastFrameTime = performance.now();
let fpsAccum = 0, fpsCount = 0;

function queueRender() {
  if (renderQueued) return;
  renderQueued = true;
  requestAnimationFrame(() => {
    renderQueued = false;
    render();
  });
}

function render() {
  const t0 = performance.now();
  const { camera, features, paths, pathsLowDetail, colors } = state;

  // Фон
  const oceanGrad = ctx.createLinearGradient(0, 0, 0, H);
  oceanGrad.addColorStop(0, '#0a1a30');
  oceanGrad.addColorStop(0.5, '#0d2540');
  oceanGrad.addColorStop(1, '#0a1a30');
  ctx.fillStyle = oceanGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(W / 2, H / 2);
  ctx.scale(camera.zoom, camera.zoom);
  ctx.translate(-camera.x, -camera.y);

  // Видимая область
  const viewLeft   = camera.x - W / 2 / camera.zoom;
  const viewRight  = camera.x + W / 2 / camera.zoom;
  const viewTop    = camera.y - H / 2 / camera.zoom;
  const viewBottom = camera.y + H / 2 / camera.zoom;

  // ==== Выбираем детализацию по зуму ====
  // При малом зуме рисуем упрощённые пути (быстрее в ~3 раза)
  const useLowDetail = camera.zoom < 1.2;
  const pathsToUse = useLowDetail ? pathsLowDetail : paths;

  // ==== Проход 1: заливки ====
  for (let i = 0; i < features.length; i++) {
    const bb = state.bboxes[i];
    const [bx1, by1] = project(bb.minX, bb.maxY);
    const [bx2, by2] = project(bb.maxX, bb.minY);
    if (bx2 < viewLeft || bx1 > viewRight || by2 < viewTop || by1 > viewBottom) continue;

    const f = features[i];
    const name = getFeatureName(f);
    const path = pathsToUse[i];

    ctx.fillStyle = colors.get(name) || '#3a5b3a';
    ctx.fill(path);
  }

  // ==== Проход 2: границы (отдельно — эффективнее) ====
  if (state.showBorders) {
    ctx.strokeStyle = 'rgba(0,0,0,0.55)';
    ctx.lineWidth = Math.max(0.4, 0.8 / camera.zoom);
    ctx.lineJoin = 'round';

    for (let i = 0; i < features.length; i++) {
      const bb = state.bboxes[i];
      const [bx1, by1] = project(bb.minX, bb.maxY);
      const [bx2, by2] = project(bb.maxX, bb.minY);
      if (bx2 < viewLeft || bx1 > viewRight || by2 < viewTop || by1 > viewBottom) continue;

      ctx.stroke(pathsToUse[i]);
    }
  }

  // ==== Проход 3: подсветка hover/selected ====
  if (state.hovered) {
    const idx = state.features.findIndex(f => getFeatureName(f) === state.hovered);
    if (idx !== -1) {
      const path = paths[idx];
      ctx.fillStyle = colors.get(state.hovered);
      ctx.globalAlpha = 0.75;
      ctx.fill(path);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = 'rgba(255,255,255,0.95)';
      ctx.lineWidth = 1.5 / camera.zoom;
      ctx.stroke(path);
    }
  }

  if (state.selected) {
    const idx = state.features.findIndex(f => getFeatureName(f) === state.selected);
    if (idx !== -1) {
      const path = paths[idx];
      ctx.fillStyle = colors.get(state.selected);
      ctx.fill(path);
      ctx.strokeStyle = '#ffcc00';
      ctx.lineWidth = 2.5 / camera.zoom;
      ctx.stroke(path);
    }
  }

  // ==== Сетка ====
  if (state.showGrid) {
    ctx.strokeStyle = 'rgba(90,140,220,0.22)';
    ctx.lineWidth = 0.6 / camera.zoom;
    ctx.beginPath();
    for (let lon = -180; lon <= 180; lon += 30) {
      const [x] = project(lon, 0);
      ctx.moveTo(x, 0); ctx.lineTo(x, WORLD.height);
    }
    for (let lat = -60; lat <= 60; lat += 30) {
      const [, y] = project(0, lat);
      ctx.moveTo(0, y); ctx.lineTo(WORLD.width, y);
    }
    ctx.stroke();

    const [, eqY] = project(0, 0);
    ctx.strokeStyle = 'rgba(255,200,80,0.55)';
    ctx.beginPath();
    ctx.moveTo(0, eqY); ctx.lineTo(WORLD.width, eqY);
    ctx.stroke();
  }

  // ==== Подписи ====
  if (state.showLabels && camera.zoom > 0.7) {
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < features.length; i++) {
      const bb = state.bboxes[i];
      const [bx1, by1] = project(bb.minX, bb.maxY);
      const [bx2, by2] = project(bb.maxX, bb.minY);
      if (bx2 < viewLeft || bx1 > viewRight || by2 < viewTop || by1 > viewBottom) continue;

      const sizeW = (bx2 - bx1) * camera.zoom;
      const sizeH = (by2 - by1) * camera.zoom;
      if (sizeW < 30 || sizeH < 14) continue;

      const cx = (bx1 + bx2) / 2;
      const cy = (by1 + by2) / 2;

      const name = getFeatureNameRu(features[i]);
      const fs = Math.max(7, Math.min(14, sizeW / 9) / camera.zoom);
      ctx.font = `bold ${fs}px 'Courier New', monospace`;
      ctx.lineWidth = 3 / camera.zoom;
      ctx.strokeStyle = 'rgba(0,0,0,0.9)';
      ctx.strokeText(name.toUpperCase(), cx, cy);
      ctx.fillStyle = '#ffffff';
      ctx.fillText(name.toUpperCase(), cx, cy);
    }
  }

  ctx.restore();

  // ==== FPS ====
  const t1 = performance.now();
  const dt = t1 - lastFrameTime;
  lastFrameTime = t1;
  fpsAccum += dt;
  fpsCount++;
  if (fpsAccum > 500) {
    const fps = Math.round(1000 / (fpsAccum / fpsCount));
    fpsEl.textContent = `${fps} FPS | ${(t1 - t0).toFixed(1)} мс`;
    fpsAccum = 0; fpsCount = 0;
  }

  // Info
  const sel = state.selected;
  document.getElementById('info').innerHTML = sel
    ? `Выбрано: <b style="color:#5a9aed">${sel}</b> | Стран: ${state.features.length}`
    : `ЛКМ — панорама | Колесо — зум | Клик — выбрать | Стран: ${state.features.length}`;
}

// ============================================================
// HIT-TEST
// ============================================================
function screenToWorld(clientX, clientY) {
  const rect = canvas.getBoundingClientRect();
  const mx = clientX - rect.left;
  const my = clientY - rect.top;
  return [
    (mx - W / 2) / state.camera.zoom + state.camera.x,
    (my - H / 2) / state.camera.zoom + state.camera.y,
  ];
}

function worldToLonLat(wx, wy) {
  const lon = wx / WORLD.width * (WORLD.lonMax - WORLD.lonMin) + WORLD.lonMin;
  const lat = WORLD.latMax - wy / WORLD.height * (WORLD.latMax - WORLD.latMin);
  return [lon, lat];
}

function pointInRing(lon, lat, ring) {
  let inside = false;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = ring[i][0], yi = ring[i][1];
    const xj = ring[j][0], yj = ring[j][1];
    if (((yi > lat) !== (yj > lat)) &&
        (lon < (xj - xi) * (lat - yi) / (yj - yi) + xi)) {
      inside = !inside;
    }
  }
  return inside;
}

function pointInGeometry(lon, lat, geom) {
  const { type, coordinates } = geom;
  if (type === 'Polygon') {
    if (!pointInRing(lon, lat, coordinates[0])) return false;
    for (let i = 1; i < coordinates.length; i++) {
      if (pointInRing(lon, lat, coordinates[i])) return false;
    }
    return true;
  } else if (type === 'MultiPolygon') {
    for (const poly of coordinates) {
      if (!pointInRing(lon, lat, poly[0])) continue;
      let inHole = false;
      for (let i = 1; i < poly.length; i++) {
        if (pointInRing(lon, lat, poly[i])) { inHole = true; break; }
      }
      if (!inHole) return true;
    }
  }
  return false;
}

function findFeatureAt(lon, lat) {
  // Сначала сортируем кандидатов по площади bbox — маленькие страны приоритетнее
  // (иначе анклавы вроде Лесото не находятся)
  const candidates = [];
  for (let i = 0; i < state.features.length; i++) {
    const bb = state.bboxes[i];
    if (lon < bb.minX || lon > bb.maxX || lat < bb.minY || lat > bb.maxY) continue;
    const area = (bb.maxX - bb.minX) * (bb.maxY - bb.minY);
    candidates.push({ i, area });
  }
  candidates.sort((a, b) => a.area - b.area);

  for (const { i } of candidates) {
    if (pointInGeometry(lon, lat, state.features[i].geometry)) {
      return state.features[i];
    }
  }
  return null;
}

// ============================================================
// КАМЕРА
// ============================================================
let isDragging = false;
let dragStart = { x: 0, y: 0 };
let cameraStart = { x: 0, y: 0 };
let dragMoved = false;

canvas.addEventListener('mousedown', e => {
  isDragging = true;
  dragMoved = false;
  dragStart = { x: e.clientX, y: e.clientY };
  cameraStart = { x: state.camera.x, y: state.camera.y };
});

window.addEventListener('mousemove', e => {
  if (isDragging) {
    const dx = e.clientX - dragStart.x;
    const dy = e.clientY - dragStart.y;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
    state.camera.x = cameraStart.x - dx / state.camera.zoom;
    state.camera.y = cameraStart.y - dy / state.camera.zoom;
    clampCamera();
    queueRender();
  } else {
    updateHover(e);
  }
});

window.addEventListener('mouseup', e => {
  if (isDragging && !dragMoved) handleClick(e);
  isDragging = false;
});

canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const oldZoom = state.camera.zoom;
  const factor = e.deltaY < 0 ? 1.2 : 0.83;
  const newZoom = Math.max(0.4, Math.min(60, oldZoom * factor));

  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;
  const wx = (mx - W / 2) / oldZoom + state.camera.x;
  const wy = (my - H / 2) / oldZoom + state.camera.y;

  state.camera.zoom = newZoom;
  state.camera.x = wx - (mx - W / 2) / newZoom;
  state.camera.y = wy - (my - H / 2) / newZoom;
  clampCamera();
  queueRender();
}, { passive: false });

function clampCamera() {
  const halfW = W / 2 / state.camera.zoom;
  const halfH = H / 2 / state.camera.zoom;
  state.camera.x = Math.max(halfW, Math.min(WORLD.width - halfW, state.camera.x));
  state.camera.y = Math.max(halfH, Math.min(WORLD.height - halfH, state.camera.y));
}

// ============================================================
// HOVER / CLICK
// ============================================================
let hoverTimeout = null;
function updateHover(e) {
  if (hoverTimeout) return;
  hoverTimeout = setTimeout(() => hoverTimeout = null, 50);

  const [wx, wy] = screenToWorld(e.clientX, e.clientY);
  const [lon, lat] = worldToLonLat(wx, wy);
  const feature = findFeatureAt(lon, lat);
  const newHover = feature ? getFeatureName(feature) : null;

  if (newHover !== state.hovered) {
    state.hovered = newHover;
    queueRender();
  }

  const rect = container.getBoundingClientRect();
  if (feature) {
    const p = feature.properties || {};
    const nameRu = getFeatureNameRu(feature);
    const nameEn = getFeatureName(feature);
    const iso = p.ISO_A3 || p.iso_a3 || '—';
    const continent = p.CONTINENT || p.continent || '—';
    const pop = p.POP_EST || p.pop_est;
    const subregion = p.SUBREGION || p.subregion || '';

    tooltip.style.display = 'block';
    let left = e.clientX - rect.left + 15;
    let top  = e.clientY - rect.top  + 15;
    if (left > W - 290) left = e.clientX - rect.left - 290;
    if (top  > H - 150) top  = e.clientY - rect.top  - 160;

    tooltip.style.left = left + 'px';
    tooltip.style.top  = top + 'px';
    tooltip.innerHTML = `
      <b>${nameRu}</b><br>
      <span style="color:#6a7a90">${nameEn}</span><br>
      ISO: ${iso}<br>
      ${subregion ? `Регион: ${subregion}<br>` : ''}
      Континент: ${continent}
      ${pop ? `<br>Население: ~${(pop / 1e6).toFixed(1)} млн` : ''}
    `;
  } else {
    tooltip.style.display = 'none';
  }
}

function handleClick(e) {
  const [wx, wy] = screenToWorld(e.clientX, e.clientY);
  const [lon, lat] = worldToLonLat(wx, wy);
  const feature = findFeatureAt(lon, lat);

  if (feature) {
    const name = getFeatureName(feature);
    state.selected = (state.selected === name) ? null : name;
  } else {
    state.selected = null;
  }
  queueRender();
}

// ============================================================
// UI
// ============================================================
document.getElementById('btnRegenerate').addEventListener('click', () => {
  state.colorSeed = Math.floor(Math.random() * 1e9);
  recolor();
  queueRender();
});
document.getElementById('btnLabels').addEventListener('click', e => {
  state.showLabels = !state.showLabels;
  e.target.classList.toggle('active', state.showLabels);
  queueRender();
});
document.getElementById('btnGrid').addEventListener('click', e => {
  state.showGrid = !state.showGrid;
  e.target.classList.toggle('active', state.showGrid);
  queueRender();
});
document.getElementById('btnBorders').addEventListener('click', e => {
  state.showBorders = !state.showBorders;
  e.target.classList.toggle('active', state.showBorders);
  queueRender();
});
document.getElementById('btnReset').addEventListener('click', () => {
  state.camera = { x: WORLD.width / 2, y: WORLD.height / 2, zoom: 0.5 };
  state.selected = null;
  state.hovered = null;
  queueRender();
});

// ============================================================
// ЗАПУСК
// ============================================================
resize();
loadWorld().then(() => {
  // Начальный вид — весь мир
  state.camera.zoom = Math.min(W / WORLD.width, H / WORLD.height) * 0.95;
  state.camera.x = WORLD.width / 2;
  state.camera.y = WORLD.height / 2;
  clampCamera();
  render();
}).catch(err => {
  document.getElementById('loading').innerHTML =
    `<div style="color:#e74c3c;text-align:center;padding:20px;max-width:400px">
       ❌ Ошибка: ${err.message}<br><br>
       <span style="font-size:11px;color:#7a8aa0">
         1. Файл <b>${GEOJSON_URL}</b> существует?<br>
         2. Открываешь через http:// (не file://)?<br>
         3. Размер файла ~5 МБ (это 50m, не 110m)?
       </span>
     </div>`;
  console.error(err);
});
</script>
</body>
</html>
